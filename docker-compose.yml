services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: stampcard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stampcard"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:devpass@db:5432/stampcard
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: